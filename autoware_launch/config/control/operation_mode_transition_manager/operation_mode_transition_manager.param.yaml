/**:
  ros__parameters:
    input_timeout: 3.0
    transition_timeout: 10.0
    frequency_hz: 10.0

    # DWA validation mode: allow engaging while moving in simulation.
    enable_engage_on_driving: true

    # Keep engage condition disabled for lightweight control verification.
    check_engage_condition: false
    nearest_dist_deviation_threshold: 10.0
    nearest_yaw_deviation_threshold: 3.14

    engage_acceptable_limits:
      allow_autonomous_in_stopped: true
      dist_threshold: 100.0
      yaw_threshold: 3.14
      speed_upper_threshold: 100.0
      speed_lower_threshold: -100.0
      acc_threshold: 100.0
      lateral_acc_threshold: 100.0
      lateral_acc_diff_threshold: 100.0

    stable_check:
      duration: 0.0
      dist_threshold: 100.0
      speed_upper_threshold: 100.0
      speed_lower_threshold: -100.0
      yaw_threshold: 3.14
